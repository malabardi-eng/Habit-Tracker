<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A7%AD</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
<style>
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#F8FAFD;
  --ink:#1B2333; --ink-soft:#64708A; --ink-faint:#97A2BA;
  --line:#E3E9F4; --line-strong:#D3DBEA;
  --nav-a:#10233F; --nav-b:#16305A; --nav-ink:#C9D3E6; --nav-ink-soft:#7C8BAE;
  --c-sport:#2F6FED; --c-sport-soft:#EAF1FF;
  --c-studio:#E8720F; --c-studio-soft:#FFEFE0;
  --c-ufficio:#7C4DEF; --c-ufficio-soft:#F1EBFF;
  --c-diario:#1B9C6E; --c-diario-soft:#E3FAF1;
  --c-danger:#D64545; --c-danger-soft:#FDEDEE;
  --shadow:0 6px 20px rgba(16,35,63,.07); --shadow-sm:0 2px 8px rgba(16,35,63,.05);
  --r-lg:18px; --r-md:12px; --r-sm:9px;
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1220; --surface:#131C31; --surface-2:#0F1728;
    --ink:#E8ECF8; --ink-soft:#93A0C0; --ink-faint:#5C6885;
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
    --nav-a:#080F1D; --nav-b:#0D1A30; --nav-ink:#C9D3E6; --nav-ink-soft:#5F6E90;
    --c-sport:#6E93FF; --c-sport-soft:rgba(110,147,255,.14);
    --c-studio:#FF9B4D; --c-studio-soft:rgba(255,155,77,.14);
    --c-ufficio:#A78BFA; --c-ufficio-soft:rgba(167,139,250,.16);
    --c-diario:#34C48F; --c-diario-soft:rgba(52,196,143,.14);
    --c-danger:#FF7A70; --c-danger-soft:rgba(255,122,112,.14);
    --shadow:0 6px 24px rgba(0,0,0,.35); --shadow-sm:0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#131C31; --surface-2:#0F1728;
  --ink:#E8ECF8; --ink-soft:#93A0C0; --ink-faint:#5C6885;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
  --nav-a:#080F1D; --nav-b:#0D1A30; --nav-ink:#C9D3E6; --nav-ink-soft:#5F6E90;
  --c-sport:#6E93FF; --c-sport-soft:rgba(110,147,255,.14);
  --c-studio:#FF9B4D; --c-studio-soft:rgba(255,155,77,.14);
  --c-ufficio:#A78BFA; --c-ufficio-soft:rgba(167,139,250,.16);
  --c-diario:#34C48F; --c-diario-soft:rgba(52,196,143,.14);
  --c-danger:#FF7A70; --c-danger-soft:rgba(255,122,112,.14);
  --shadow:0 6px 24px rgba(0,0,0,.35); --shadow-sm:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;color:inherit;}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
::selection{background:var(--c-sport);color:#fff;}

/* ---- shell ---- */
.app{display:flex;min-height:100vh;}
.rail{
  width:238px;flex-shrink:0;background:linear-gradient(180deg,var(--nav-a),var(--nav-b));
  color:var(--nav-ink);display:flex;flex-direction:column;padding:22px 15px;
  position:sticky;top:0;height:100vh;
}
.rail-logo{display:flex;align-items:center;gap:9px;padding:6px 9px 22px;font-family:var(--font-display);font-weight:700;font-size:1.12rem;color:#fff;}
.rail-nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.rail-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--nav-ink-soft);padding:13px 11px 4px;}
.rail-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:var(--nav-ink);padding:9px 11px;border-radius:var(--r-sm);font-size:.92rem;cursor:pointer;transition:background .15s,color .15s;}
.rail-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.rail-item.active{background:var(--c-sport);color:#fff;box-shadow:var(--shadow-sm);}
.rail-icon{font-size:1.02rem;width:1.2em;text-align:center;}
.rail-foot{margin-top:auto;padding-top:14px;}
.sync-pill{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--nav-ink-soft);padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.05);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#5FCB8F;flex-shrink:0;}
.sync-dot.local{background:#E8B84B;}
.sync-pill-top{display:none;color:var(--ink-soft);background:var(--surface);box-shadow:var(--shadow-sm);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 30px 16px;gap:14px;flex-wrap:wrap;}
.topbar h1{font-size:1.4rem;}
.topbar .today{font-family:var(--font-mono);color:var(--ink-soft);font-size:.82rem;background:var(--surface);padding:7px 13px;border-radius:999px;box-shadow:var(--shadow-sm);text-transform:capitalize;}
.view{flex:1;padding:0 30px 100px;display:flex;flex-direction:column;gap:18px;max-width:1100px;width:100%;}

.local-banner{margin:0 30px;background:var(--c-studio-soft);border:1px solid color-mix(in srgb, var(--c-studio) 35%, transparent);color:var(--c-studio);padding:10px 15px;border-radius:var(--r-md);font-size:.83rem;line-height:1.5;}

/* bottom tabs (mobile) */
.tabbar{display:none;}
@media (max-width:860px){
  .rail{display:none;}
  .topbar{padding:18px 18px 12px;}
  .view{padding:0 16px 92px;}
  .local-banner{margin:0 16px;}
  .sync-pill-top{display:flex;}
  .tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:var(--surface);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 18px rgba(16,35,63,.08);
  }
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--ink-faint);padding:6px 2px;font-size:.63rem;border-radius:var(--r-sm);cursor:pointer;}
  .tab-item .tab-icon{font-size:1.24rem;}
  .tab-item.active{color:var(--c-sport);}
}

/* ---- cards / generic ---- */
.card{background:var(--surface);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow);}
.card-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.card-header h3{font-size:1.02rem;}
.card-sub{color:var(--ink-faint);font-size:.8rem;font-family:var(--font-mono);}
.card-text{color:var(--ink-soft);font-size:.87rem;line-height:1.55;}
.intro{border-left:4px solid var(--accent, var(--c-sport));color:var(--ink-soft);font-size:.9rem;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:760px){.grid-2{grid-template-columns:1fr;}}

/* stat tiles */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media (max-width:760px){.stat-row{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--surface);border-radius:var(--r-lg);padding:16px 17px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);}
.stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;background:var(--accent-soft, var(--c-sport-soft));}
.stat-label{font-size:.74rem;color:var(--ink-soft);}
.stat-value{font-family:var(--font-mono);font-weight:600;font-size:1.42rem;line-height:1.15;font-variant-numeric:tabular-nums;}
.stat-sub{font-size:.7rem;color:var(--ink-faint);}

/* badges / tags */
.badge{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.95rem;background:var(--accent-soft,var(--c-sport-soft));}
.tag{font-size:.63rem;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;}
.tag-custom{background:var(--c-diario-soft);color:var(--c-diario);}
.tag-default{background:var(--surface-2);color:var(--ink-faint);border:1px solid var(--line);}

/* buttons */
.btn{border:none;border-radius:var(--r-sm);padding:9px 15px;font-size:.86rem;font-weight:600;cursor:pointer;transition:transform .05s,opacity .15s,background .15s;font-family:var(--font-body);}
.btn:active{transform:scale(.98);}
.btn-sm{padding:6px 11px;font-size:.78rem;}
.btn-block{width:100%;margin-top:11px;}
.btn-primary{background:var(--c-sport);color:#fff;}
.btn-primary:hover{opacity:.92;}
.btn-ghost{background:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:var(--c-danger-soft);color:var(--c-danger);}
.btn-danger:hover{opacity:.85;}
.btn-outline{background:transparent;color:var(--accent,var(--c-sport));border:1.5px solid var(--accent,var(--c-sport));}
.btn-outline:hover{background:var(--accent-soft,var(--c-sport-soft));}
.icon-btn{background:transparent;border:1.5px solid transparent;cursor:pointer;font-size:.92rem;padding:5px 7px;border-radius:8px;opacity:.75;color:var(--ink-soft);}
.icon-btn:hover{opacity:1;background:var(--surface-2);}
.icon-btn.framed{border-color:var(--line);background:var(--surface);}
.icon-btn.framed:hover{border-color:var(--accent,var(--line-strong));}
.icon-btn:disabled{opacity:.32;cursor:default;}
.icon-btn:disabled:hover{background:transparent;}

/* month nav */
.month-nav{display:flex;align-items:center;gap:7px;}
.month-nav .label{font-family:var(--font-mono);font-size:.82rem;color:var(--ink-soft);min-width:7.5em;text-align:center;}

/* activity grid */
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.act-card{background:var(--surface);border-radius:var(--r-lg);padding:16px 17px;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.act-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:9px;}
.act-name{font-weight:600;font-size:.94rem;}
.act-stats{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.76rem;color:var(--ink-soft);margin-bottom:2px;font-family:var(--font-mono);}
.act-add{border:1.5px dashed var(--line-strong);background:transparent;box-shadow:none;align-items:center;justify-content:center;text-align:center;color:var(--ink-faint);cursor:pointer;gap:6px;min-height:120px;}
.act-add:hover{border-color:var(--c-sport);color:var(--c-sport);}
.add-icon{font-size:1.5rem;}

/* recent list */
.rlist{display:flex;flex-direction:column;}
.rrow{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);}
.rrow:last-child{border-bottom:none;}
.rmain{flex:1;min-width:0;}
.rtitle{font-weight:600;font-size:.89rem;}
.rdate{font-weight:400;color:var(--ink-faint);font-size:.76rem;margin-left:7px;font-family:var(--font-mono);}
.rdur{font-weight:500;color:var(--c-sport);font-size:.74rem;margin-left:7px;background:var(--c-sport-soft);padding:1px 8px;border-radius:999px;font-family:var(--font-mono);}
.rdesc{color:var(--ink-soft);font-size:.82rem;margin-top:2px;white-space:pre-wrap;}
.ractions{display:flex;gap:2px;flex-shrink:0;}

/* period pills */
.pills{display:flex;flex-direction:column;gap:9px;margin-bottom:12px;}
.pill{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--r-md);border-left:3px solid var(--accent,var(--c-sport));background:var(--surface-2);flex-wrap:wrap;}
.pill-label{font-size:.82rem;font-weight:500;flex:1;}
.pill-value{font-family:var(--font-mono);font-weight:600;font-size:.92rem;}
.delta{font-size:.72rem;font-family:var(--font-mono);}
.delta-up{color:var(--c-diario);}
.delta-down{color:var(--c-studio);}
.delta-flat{color:var(--ink-faint);}

/* donut / barlist */
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.donut{border-radius:50%;position:relative;flex-shrink:0;}
.donut-hole{position:absolute;background:var(--surface);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-center-value{font-family:var(--font-mono);font-weight:700;font-size:1.3rem;}
.donut-center-sub{font-size:.68rem;color:var(--ink-faint);}
.donut-legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:120px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:.83rem;}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.legend-label{flex:1;color:var(--ink-soft);}
.legend-value{font-family:var(--font-mono);font-weight:600;}
.barlist{display:flex;flex-direction:column;gap:10px;}
.bar-row{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;}
.bar-label{font-size:.8rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{background:var(--surface-2);border-radius:999px;height:9px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;}
.bar-value{font-size:.78rem;color:var(--ink-soft);text-align:right;font-family:var(--font-mono);}

/* year heatmap */
.heat{overflow-x:auto;padding-bottom:4px;}
.heat-months{display:grid;font-size:.68rem;color:var(--ink-faint);margin-bottom:4px;font-family:var(--font-mono);}
.heat-month{white-space:nowrap;}
.heat-grid{display:grid;grid-auto-flow:column;gap:3px;width:max-content;}
.heat-col{display:grid;grid-template-rows:repeat(7,12px);gap:3px;}
.heat-cell{width:12px;height:12px;border-radius:3px;background:var(--surface-2);}
.heat-cell.l0{background:var(--surface-2);}
.heat-cell.l1{background:color-mix(in srgb, var(--c-sport) 28%, var(--surface-2));}
.heat-cell.l2{background:color-mix(in srgb, var(--c-sport) 52%, var(--surface-2));}
.heat-cell.l3{background:color-mix(in srgb, var(--c-sport) 76%, var(--surface-2));}
.heat-cell.l4{background:var(--c-sport);}
.heat-cell.empty{background:transparent;}
.heat-scale{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:.68rem;color:var(--ink-faint);}

/* month calendar (office + diario share this) */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:.68rem;color:var(--ink-faint);text-align:center;padding:0 2px;margin-bottom:6px;font-family:var(--font-mono);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{min-height:62px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;padding:7px 8px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;}
.cal-cell:hover{border-color:var(--accent,var(--c-sport));}
.cal-cell.empty,.cal-cell.future{cursor:default;border:1px dashed var(--line);background:transparent;}
.cal-cell.empty{visibility:hidden;border:none;}
.cal-cell.future{opacity:.5;}
.cal-day{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-soft);font-weight:600;}
.cal-cell.today{border-color:var(--accent,var(--c-sport));box-shadow:0 0 0 2px var(--accent-soft,var(--c-sport-soft));}
.cal-cell.today .cal-day{color:var(--accent,var(--c-sport));}
.cal-cell.filled{background:var(--accent-soft,var(--c-sport-soft));}
.cal-bottom{display:flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;color:var(--accent,var(--c-sport));font-family:var(--font-mono);}

/* office slots in modal */
.slot-row{display:flex;align-items:center;gap:8px;}
.slot-row input[type=time]{flex:1;}
.slot-sep{color:var(--ink-faint);}

/* diary photos */
.photo-grid{display:flex;flex-wrap:wrap;gap:9px;}
.photo-thumb{position:relative;width:80px;height:80px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);background:var(--surface-2);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb.pending{opacity:.5;}
.photo-remove{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;border:none;background:rgba(10,15,25,.68);color:#fff;font-size:.66rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.photo-remove:hover{background:rgba(10,15,25,.88);}

/* history */
.filters-bar{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
.filter-field{display:flex;flex-direction:column;gap:4px;}
.filter-field label{font-size:.72rem;color:var(--ink-soft);font-weight:600;}
.filter-field select{padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);}
.filter-count{color:var(--ink-faint);font-size:.82rem;align-self:center;font-family:var(--font-mono);}
.hist-group{background:var(--surface);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:0;}
.hist-date{font-family:var(--font-mono);font-weight:600;font-size:.82rem;color:var(--ink-soft);margin-bottom:6px;}

/* settings */
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.87rem;}
.settings-row:last-child{border-bottom:none;}
.settings-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.danger-title{color:var(--c-danger);}

.empty{color:var(--ink-faint);font-size:.87rem;padding:22px 4px;text-align:center;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,14,26,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px;}
.overlay.hidden{display:none;}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:430px;padding:20px 22px 18px;box-shadow:0 24px 60px rgba(8,14,26,.35);max-height:88vh;overflow-y:auto;}
.modal.wide{max-width:620px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.modal-head h3{font-size:1.06rem;}
.modal-form{display:flex;flex-direction:column;gap:13px;}
.row{display:flex;flex-direction:column;gap:5px;}
.row-split{display:flex;gap:11px;}
.row-split .row{flex:1;}
.row label{font-size:.76rem;color:var(--ink-soft);font-weight:600;}
.row input,.row select,.row textarea{padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:.88rem;background:var(--surface);resize:vertical;}
.row input:focus,.row select:focus,.row textarea:focus{outline:none;border-color:var(--c-sport);box-shadow:0 0 0 3px var(--c-sport-soft);}
.modal-actions{display:flex;align-items:center;justify-content:space-between;margin-top:2px;gap:8px;flex-wrap:wrap;}
.modal-actions>div{display:flex;gap:8px;}

/* sheet (mobile "more") */
.sheet-item{display:flex;align-items:center;gap:11px;width:100%;padding:13px 6px;background:none;border:none;border-bottom:1px solid var(--line);text-align:left;font-size:.94rem;color:var(--ink);cursor:pointer;}
.sheet-item:last-child{border-bottom:none;}
.sheet-icon{font-size:1.15rem;}

[hidden]{display:none!important;}
</style>
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-logo"><span>🧭</span><span>Habit Tracker</span></div>
    <nav class="rail-nav" id="rail-nav"></nav>
    <div class="rail-foot"><div class="sync-pill"><span class="sync-dot" data-sync-dot></span><span data-sync-text>Connessione…</span></div></div>
  </aside>

  <main class="main">
    <div id="local-banner" class="local-banner" hidden>
      ⚠️ Modalità offline: non riesco a raggiungere il server, i dati restano solo su questo dispositivo per ora. Controlla la connessione e ricarica la pagina appena possibile.
    </div>
    <header class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <span class="sync-pill sync-pill-top"><span class="sync-dot" data-sync-dot></span><span data-sync-text>Connessione…</span></span>
      <span class="today" id="today-date"></span>

<script>
/* =========================================================
   UTIL
   ========================================================= */
function todayISO(){const d=new Date();return isoOf(d);}
function isoOf(d){const off=d.getTimezoneOffset();const l=new Date(d.getTime()-off*60000);return l.toISOString().slice(0,10);}
function addDays(d,n){const c=new Date(d);c.setDate(c.getDate()+n);return c;}
function formatDateIT(iso){const[y,m,d]=iso.split("-");return `${d}/${m}/${y}`;}
function weekdayLabelsIT(){return["L","M","M","G","V","S","D"];}
function minutesToHM(t){const n=Math.max(0,Math.round(t||0));const h=Math.floor(n/60),m=n%60;if(h===0)return `${m}m`;if(m===0)return `${h}h`;return `${h}h ${m}m`;}
function timeToMinutes(hhmm){if(!hhmm||typeof hhmm!=="string")return null;const[h,m]=hhmm.split(":").map(Number);if(!Number.isFinite(h)||!Number.isFinite(m))return null;return h*60+m;}
function monthKeyOf(iso){return iso.slice(0,7);}
function weekLabel(mon,sun){const f=d=>d.toLocaleDateString("it-IT",{day:"numeric",month:"short"});return `${f(mon)} – ${f(sun)}`;}
function weekRange(ref=todayISO()){const r=new Date(ref);const dow=(r.getDay()+6)%7;const mon=addDays(r,-dow);const sun=addDays(mon,6);return{fromISO:isoOf(mon),toISO:isoOf(sun),label:weekLabel(mon,sun)};}
function prevWeekRange(ref=todayISO()){const{fromISO}=weekRange(ref);const pm=addDays(new Date(fromISO),-7);const ps=addDays(pm,6);return{fromISO:isoOf(pm),toISO:isoOf(ps)};}
function monthRange(ref=todayISO()){const r=new Date(ref);const f=new Date(r.getFullYear(),r.getMonth(),1);const l=new Date(r.getFullYear(),r.getMonth()+1,0);const lab=r.toLocaleDateString("it-IT",{month:"long",year:"numeric"});return{fromISO:isoOf(f),toISO:isoOf(l),label:lab.charAt(0).toUpperCase()+lab.slice(1)};}
function monthLabelOf(year,month){const s=new Date(year,month,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"});return s.charAt(0).toUpperCase()+s.slice(1);}
function escapeHTML(str){const d=document.createElement("div");d.textContent=str==null?"":String(str);return d.innerHTML;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
function slugify(str){return str.toLowerCase().trim().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||uid();}
function normalizeDuration(v){if(v===undefined||v===null||v==="")return null;const n=Math.round(Number(v));if(!Number.isFinite(n)||n<=0)return null;return n;}
function daysAgoLabel(iso){if(!iso)return "mai";const diff=Math.round((new Date(todayISO())-new Date(iso))/86400000);if(diff===0)return "oggi";if(diff===1)return "ieri";return `${diff} giorni fa`;}

/* =========================================================
   STATS
   ========================================================= */
const Stats={
  dateSet(entries,{categoryId,activityId}={}){const s=new Set();for(const e of entries){if(categoryId&&e.categoryId!==categoryId)continue;if(activityId&&e.activityId!==activityId)continue;s.add(e.date);}return s;},
  currentStreak(dateSet){let streak=0;let cur=new Date(todayISO());if(!dateSet.has(isoOf(cur)))cur=addDays(cur,-1);while(dateSet.has(isoOf(cur))){streak++;cur=addDays(cur,-1);}return streak;},
  longestStreak(dateSet){if(dateSet.size===0)return 0;const dates=[...dateSet].sort();let longest=1,cur=1;for(let i=1;i<dates.length;i++){const d=Math.round((new Date(dates[i])-new Date(dates[i-1]))/86400000);if(d===1)cur++;else if(d>1)cur=1;longest=Math.max(longest,cur);}return longest;},
  entriesInRange(entries,f,t){return entries.filter(e=>e.date>=f&&e.date<=t);},
  countsByCategory(entries){const o={};for(const e of entries)o[e.categoryId]=(o[e.categoryId]||0)+1;return o;},
  countsByActivity(entries){const o={};for(const e of entries){const k=`${e.categoryId}::${e.activityId}`;o[k]=(o[k]||0)+1;}return o;},
  heatmapCounts(entries,f,t){const o={};for(const e of entries){if(e.date<f||e.date>t)continue;o[e.date]=(o[e.date]||0)+1;}return o;},
  totalMinutes(entries){return entries.reduce((s,e)=>s+(e.durationMin||0),0);},
  minutesByCategory(entries){const o={};for(const e of entries)o[e.categoryId]=(o[e.categoryId]||0)+(e.durationMin||0);return o;},
  minutesByActivity(entries){const o={};for(const e of entries){const k=`${e.categoryId}::${e.activityId}`;o[k]=(o[k]||0)+(e.durationMin||0);}return o;},
  officeDayMinutes(day){if(!day||!Array.isArray(day.slots))return 0;return day.slots.reduce((s,sl)=>{const i=timeToMinutes(sl.in),o=timeToMinutes(sl.out);if(i===null||o===null||o<=i)return s;return s+(o-i);},0);},
  officeMinutesInRange(days,f,t){let tot=0;for(const[date,day]of Object.entries(days||{})){if(date<f||date>t)continue;tot+=this.officeDayMinutes(day);}return tot;}
};

/* =========================================================
   DEFAULTS / ROUTES
   ========================================================= */
const CATEGORY_ORDER=["sport","studio"];
const DEFAULT_CATEGORIES={
  sport:{id:"sport",name:"Sport",icon:"🏃",color:"sport",activities:[
    {id:"pesi",name:"Allenamento con pesi",custom:false},
    {id:"corpo_libero",name:"Allenamento corpo libero",custom:false},
    {id:"calciotto",name:"Calciotto",custom:false},
    {id:"camminata",name:"Camminata",custom:false},
    {id:"corsa",name:"Corsa",custom:false},
    {id:"nuoto",name:"Nuoto",custom:false}
  ]},

    {id:"inglese",name:"Inglese",custom:false},
    {id:"ia_corsi",name:"Intelligenza artificiale — corsi",custom:false},
    {id:"ia_aggiornamenti",name:"Intelligenza artificiale — aggiornamenti",custom:false},
    {id:"comunicazione",name:"Comunicazione",custom:false},
    {id:"marketing",name:"Marketing",custom:false},
    {id:"commerciale",name:"Commerciale",custom:false}
  ]}
};
const ROUTES=[
  {id:"dashboard",label:"Dashboard",icon:"📊",group:null},

  {id:"studio",label:"Studio",icon:"📚",group:"Attività"},

  {id:"diario",label:"Diario",icon:"📔",group:"Personale"},
  {id:"storico",label:"Storico",icon:"🗓️",group:"Altro"},
  {id:"impostazioni",label:"Impostazioni",icon:"⚙️",group:"Altro"}
];
const BOTTOM_TAB_IDS=["dashboard","sport","studio","ufficio","diario"];


/* =========================================================
   DATA LAYER — Supabase REST (stesso progetto di "Le mie finanze",
   tabelle separate con prefisso habit_), con fallback locale offline
   ========================================================= */
var SUPABASE_URL = "https://dlihwgoddmdbeedqgkww.supabase.co";
var SUPABASE_KEY = "sb_publishable_HMjSVRl0CMmlpCpbDTkeZQ_hXtA_-DN";
var REST = SUPABASE_URL + "/rest/v1";
var LOCAL_KEY = "habitTrackerLocalCacheV1";

function sbHeaders(extra){
  var h = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}
function sbFetch(path, opts){
  opts = opts || {};
  var extraHeaders = opts.prefer ? { "Prefer": opts.prefer } : null;
  return fetch(REST + path, {
    method: opts.method || "GET",
    headers: sbHeaders(extraHeaders),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(res){
    if (!res.ok) return res.text().then(function(t){ throw new Error("Supabase " + res.status + ": " + t); });
    if (res.status === 204) return null;
    var len = res.headers.get("content-length");
    if (len === "0") return null;
    return res.json();
  });
}

const Data={
  online:false,
  CATEGORIES:structuredClone(DEFAULT_CATEGORIES),
  ENTRIES:[],
  OFFICE_DAYS:{},
  DIARIO_DAYS:{},
  PHOTO_CACHE:{},

  async init(){
    await this.loadAll();
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") this.loadAll(); });
    window.addEventListener("online",()=>this.loadAll());
  },

  async loadAll(){
    updateSyncUI("busy");
    try{
      const[acts,entries,office,diario]=await Promise.all([
        sbFetch("/habit_activities?select=category_id,id,name,custom&order=name"),
        sbFetch("/habit_entries?select=id,date,category_id,activity_id,description,duration_min,created_at&order=date.desc"),
        sbFetch("/habit_office_days?select=date,slots,notes"),
        sbFetch("/habit_diario_days?select=date,text,photo_ids")
      ]);
      this._applyActivities(acts||[]);
      this.ENTRIES=(entries||[]).map(e=>({id:e.id,date:e.date,categoryId:e.category_id,activityId:e.activity_id,description:e.description||"",durationMin:e.duration_min,createdAt:e.created_at}));
      this.OFFICE_DAYS=Object.fromEntries((office||[]).map(d=>[d.date,{slots:d.slots||[],notes:d.notes||""}]));
      this.DIARIO_DAYS=Object.fromEntries((diario||[]).map(d=>[d.date,{text:d.text||"",photoIds:d.photo_ids||[]}]));
      this.online=true;
      this._persistLocal();
    }catch(e){
      this.online=false;
      this._loadLocal();
    }
    updateSyncUI();
    render();
  },

  _applyActivities(rows){
    const byCat={};
    for(const r of rows){ (byCat[r.category_id]||=[]).push({id:r.id,name:r.name,custom:!!r.custom}); }
    for(const cid of CATEGORY_ORDER){
      const list=byCat[cid];
      this.CATEGORIES[cid]=Object.assign({},DEFAULT_CATEGORIES[cid],{activities:(list&&list.length)?list:DEFAULT_CATEGORIES[cid].activities});
    }
  },

  _loadLocal(){
    try{
      const raw=localStorage.getItem(LOCAL_KEY);
      if(raw){
        const p=JSON.parse(raw);
        if(p.categories) this.CATEGORIES=p.categories;
        this.ENTRIES=p.entries||[];
        this.OFFICE_DAYS=p.office||{};
        this.DIARIO_DAYS=p.diario||{};
        this.PHOTO_CACHE=p.photos||{};
      }
    }catch(e){/* ignore */}
  },
  _persistLocal(){
    try{ localStorage.setItem(LOCAL_KEY,JSON.stringify({categories:this.CATEGORIES,entries:this.ENTRIES,office:this.OFFICE_DAYS,diario:this.DIARIO_DAYS,photos:this.PHOTO_CACHE})); }
    catch(e){/* ignore */}
  },

  async addActivity(categoryId,name){
    const cat=this.CATEGORIES[categoryId]; if(!cat)return null;
    const base=slugify(name); let id=base,i=1;
    while(cat.activities.some(a=>a.id===id)) id=`${base}_${i++}`;
    const activity={id,name:name.trim(),custom:true};
    cat.activities.push(activity); render();
    try{ await sbFetch("/habit_activities",{method:"POST",body:{category_id:categoryId,id,name:activity.name,custom:true}}); this._persistLocal(); }
    catch(e){ alert("Non sono riuscito a salvare la nuova attività: "+e.message); }
    return activity;
  },
  async removeActivity(categoryId,activityId){
    const cat=this.CATEGORIES[categoryId]; if(!cat)return false;
    const idx=cat.activities.findIndex(a=>a.id===activityId); if(idx===-1)return false;
    if(!cat.activities[idx].custom)return false;
    cat.activities.splice(idx,1); render();
    try{ await sbFetch(`/habit_activities?category_id=eq.${encodeURIComponent(categoryId)}&id=eq.${encodeURIComponent(activityId)}`,{method:"DELETE"}); this._persistLocal(); }
    catch(e){ alert("Non sono riuscito a rimuovere l'attività: "+e.message); }
    return true;
  },
  getActivity(categoryId,activityId){
    const cat=this.CATEGORIES[categoryId]; if(!cat)return null;
    return cat.activities.find(a=>a.id===activityId)||null;
  },
  allActivitiesFlat(){
    const out=[];
    for(const cat of Object.values(this.CATEGORIES)) for(const a of cat.activities) out.push({...a,categoryId:cat.id,categoryName:cat.name,categoryColor:cat.color});
    return out;
  },

  async addEntry({date,categoryId,activityId,description,durationMin}){
    const payload={date:date||todayISO(),category_id:categoryId,activity_id:activityId,description:(description||"").trim(),duration_min:normalizeDuration(durationMin)};
    let row;
    try{ const res=await sbFetch("/habit_entries",{method:"POST",body:payload,prefer:"return=representation"}); row=res[0]; }
    catch(e){ alert("Non sono riuscito a salvare: "+e.message); return null; }
    const entry={id:row.id,date:row.date,categoryId:row.category_id,activityId:row.activity_id,description:row.description||"",durationMin:row.duration_min,createdAt:row.created_at};
    this.ENTRIES.push(entry); this._persistLocal(); render();
    return entry;
  },
  async updateEntry(id,changes){
    const entry=this.ENTRIES.find(e=>e.id===id); if(!entry)return null;
    const payload={};
    if("date" in changes) payload.date=changes.date;
    if("categoryId" in changes) payload.category_id=changes.categoryId;
    if("activityId" in changes) payload.activity_id=changes.activityId;
    if("description" in changes) payload.description=changes.description;
    if("durationMin" in changes) payload.duration_min=normalizeDuration(changes.durationMin);
    try{ await sbFetch(`/habit_entries?id=eq.${encodeURIComponent(id)}`,{method:"PATCH",body:payload}); }
    catch(e){ alert("Non sono riuscito a salvare: "+e.message); return null; }
    Object.assign(entry,{
      date:payload.date!==undefined?payload.date:entry.date,
      categoryId:payload.category_id!==undefined?payload.category_id:entry.categoryId,
      activityId:payload.activity_id!==undefined?payload.activity_id:entry.activityId,
      description:payload.description!==undefined?payload.description:entry.description,
      durationMin:payload.duration_min!==undefined?payload.duration_min:entry.durationMin
    });
    this._persistLocal(); render();
    return entry;
  },
  async removeEntry(id){
    const idx=this.ENTRIES.findIndex(e=>e.id===id); if(idx===-1)return false;
    this.ENTRIES.splice(idx,1); render();
    try{ await sbFetch(`/habit_entries?id=eq.${encodeURIComponent(id)}`,{method:"DELETE"}); this._persistLocal(); }
    catch(e){ alert("Non sono riuscito a eliminare: "+e.message); }
    return true;
  },

  async resetSportStudio(){
    this.CATEGORIES=structuredClone(DEFAULT_CATEGORIES); this.ENTRIES=[]; render();
    try{
      await Promise.all([
        sbFetch("/habit_entries?id=not.is.null",{method:"DELETE"}),
        sbFetch("/habit_activities?custom=eq.true",{method:"DELETE"})
      ]);
      this._persistLocal();
    }catch(e){ alert("Il ripristino locale è avvenuto, ma non sono riuscito a pulire il server: "+e.message); }
  },

  getOfficeDay(date){ return this.OFFICE_DAYS[date]||null; },
  async saveOfficeDay(date,{slots,notes}){
    const cleanSlots=(slots||[]).filter(s=>s&&s.in&&s.out&&s.out>s.in).sort((a,b)=>a.in<b.in?-1:1);
    const cleanNotes=(notes||"").trim();
    if(!cleanSlots.length&&!cleanNotes) return this.deleteOfficeDay(date);
    this.OFFICE_DAYS[date]={slots:cleanSlots,notes:cleanNotes}; render();
    try{ await sbFetch("/habit_office_days?on_conflict=date",{method:"POST",body:{date,slots:cleanSlots,notes:cleanNotes},prefer:"resolution=merge-duplicates"}); this._persistLocal(); }
    catch(e){ alert("Non sono riuscito a salvare: "+e.message); }
    return this.OFFICE_DAYS[date];
  },
  async deleteOfficeDay(date){
    const existed=!!this.OFFICE_DAYS[date]; delete this.OFFICE_DAYS[date]; render();
    try{ await sbFetch(`/habit_office_days?date=eq.${date}`,{method:"DELETE"}); this._persistLocal(); }
    catch(e){ alert("Non sono riuscito a eliminare: "+e.message); }
    return existed;
  },

  getDiaryDay(date){ return this.DIARIO_DAYS[date]||null; },
  async saveDiaryDay(date,{text,photoIds}){
    const cleanText=(text||"").trim();
    const ids=Array.isArray(photoIds)?photoIds:[];
    if(!cleanText&&!ids.length) return this.deleteDiaryDay(date);
    this.DIARIO_DAYS[date]={text:cleanText,photoIds:ids}; render();
    try{ await sbFetch("/habit_diario_days?on_conflict=date",{method:"POST",body:{date,text:cleanText,photo_ids:ids},prefer:"resolution=merge-duplicates"}); this._persistLocal(); }
    catch(e){ alert("Non sono riuscito a salvare: "+e.message); }
    return this.DIARIO_DAYS[date];
  },
  async deleteDiaryDay(date){
    const day=this.DIARIO_DAYS[date];
    if(day&&Array.isArray(day.photoIds)) await Promise.all(day.photoIds.map(id=>this.deletePhoto(id)));
    const existed=!!this.DIARIO_DAYS[date]; delete this.DIARIO_DAYS[date]; render();
    try{ await sbFetch(`/habit_diario_days?date=eq.${date}`,{method:"DELETE"}); this._persistLocal(); }
    catch(e){ alert("Non sono riuscito a eliminare: "+e.message); }
    return existed;
  },
  async addPhoto(dataUrl,date){
    let id;
    try{ const res=await sbFetch("/habit_diario_photos",{method:"POST",body:{date,data_url:dataUrl},prefer:"return=representation"}); id=res[0].id; }
    catch(e){ alert("Non sono riuscito a caricare la foto: "+e.message); throw e; }
    this.PHOTO_CACHE[id]=dataUrl; this._persistLocal();
    return id;
  },
  async deletePhoto(id){
    delete this.PHOTO_CACHE[id];
    try{ await sbFetch(`/habit_diario_photos?id=eq.${id}`,{method:"DELETE"}); }catch(e){/* ignore */}
  },
  async getPhotos(ids){
    if(!ids||!ids.length)return[];
    const missing=ids.filter(id=>!this.PHOTO_CACHE[id]);
    if(missing.length){
      try{
        const rows=await sbFetch(`/habit_diario_photos?id=in.(${missing.join(",")})&select=id,data_url`);
        (rows||[]).forEach(r=>{ this.PHOTO_CACHE[r.id]=r.data_url; });
      }catch(e){/* fall back to whatever is cached */}
    }
    const order=new Map(ids.map((id,i)=>[id,i]));
    return ids.map(id=>({id,dataUrl:this.PHOTO_CACHE[id]})).filter(p=>p.dataUrl).sort((a,b)=>order.get(a.id)-order.get(b.id));
  }
};

function updateSyncUI(mode){
  const dots=document.querySelectorAll("[data-sync-dot]"),texts=document.querySelectorAll("[data-sync-text]");
  const banner=document.getElementById("local-banner");
  if(!dots.length)return;
  let label,local;
  if(mode==="busy"){ label="Sincronizzazione…"; local=false; }
  else if(Data.online){ label="Sincronizzato"; local=false; }
  else { label="Modalità offline"; local=true; }
  dots.forEach(d=>d.classList.toggle("local",local));
  texts.forEach(t=>t.textContent=label);
  if(banner) banner.hidden=!local;
}

<script>
/* =========================================================
   CHART BUILDERS
   ========================================================= */
const COLOR_VAR={sport:"--c-sport",studio:"--c-studio",ufficio:"--c-ufficio",diario:"--c-diario"};

function donutChartHTML(segments,{size=148,thickness=22,centerLabel="",centerSub=""}={}){
  const total=segments.reduce((s,x)=>s+x.value,0)||1;
  let acc=0;
  const stops=segments.map(seg=>{
    const from=(acc/total)*360; acc+=seg.value; const to=(acc/total)*360;
    return `var(${COLOR_VAR[seg.color]||"--c-sport"}) ${from}deg ${to}deg`;
  }).join(", ");
  const legend=segments.map(seg=>{
    const pct=Math.round((seg.value/total)*100);
    return `<div class="legend-item"><span class="legend-dot" style="background:var(${COLOR_VAR[seg.color]||"--c-sport"})"></span><span class="legend-label">${escapeHTML(seg.label)}</span><span class="legend-value">${pct}%</span></div>`;
  }).join("");
  return `<div class="donut-wrap">
    <div class="donut" style="width:${size}px;height:${size}px;background:conic-gradient(${segments.reduce((s,x)=>s+x.value,0)?stops:"var(--surface-2) 0deg 360deg"});">
      <div class="donut-hole" style="inset:${thickness}px;"><div class="donut-center-value">${centerLabel}</div><div class="donut-center-sub">${centerSub}</div></div>
    </div>
    <div class="donut-legend">${legend}</div>
  </div>`;
}

function barListHTML(items,{color="sport"}={}){
  const max=Math.max(1,...items.map(i=>i.value));
  return `<div class="barlist">${items.map(i=>`
    <div class="bar-row">
      <div class="bar-label" title="${escapeHTML(i.label)}">${escapeHTML(i.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(i.value/max)*100}%;background:var(${COLOR_VAR[i.color||color]||"--c-sport"})"></div></div>
      <div class="bar-value">${i.displayValue!==undefined?i.displayValue:i.value}</div>
    </div>`).join("")}</div>`;
}

function heatmapHTML(counts,{year}={}){
  const today=new Date(todayISO());
  const y=year||today.getFullYear();
  const isCurrentYear=y===today.getFullYear();
  const jan1=new Date(y,0,1), dec31=new Date(y,11,31);
  const startDow=(jan1.getDay()+6)%7;
  const startMonday=addDays(jan1,-startDow);
  const endDow=(dec31.getDay()+6)%7;
  const endSunday=addDays(dec31,6-endDow);
  const utcDays=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000;
  const weeks=Math.floor((utcDays(endSunday)-utcDays(startMonday))/7)+1;
  const max=Math.max(1,...Object.values(counts));
  const levelOf=c=>{ if(!c)return 0; const r=c/max; if(r>0.75)return 4; if(r>0.5)return 3; if(r>0.25)return 2; return 1; };
  const monthLabels=[]; let cols=""; let lastMonth=null;
  for(let w=0;w<weeks;w++){
    const weekStart=addDays(startMonday,w*7);
    const labelDay=weekStart.getFullYear()<y?jan1:weekStart;
    const monthName=labelDay.toLocaleDateString("it-IT",{month:"short"});
    if(monthName!==lastMonth){ monthLabels.push({col:w,label:monthName}); lastMonth=monthName; }
    let cells="";
    for(let d=0;d<7;d++){
      const day=addDays(weekStart,d);
      const iso=isoOf(day);
      const outOfYear=day.getFullYear()!==y;
      const inFuture=isCurrentYear&&day>today;
      if(outOfYear||inFuture){ cells+=`<div class="heat-cell empty"></div>`; continue; }
      const c=counts[iso]||0;
      cells+=`<div class="heat-cell l${levelOf(c)}" title="${formatDateIT(iso)} — ${c} attività"></div>`;
    }
    cols+=`<div class="heat-col">${cells}</div>`;
  }
  const labelsRow=monthLabels.map(m=>`<span class="heat-month" style="grid-column:${m.col+1}">${m.label}</span>`).join("");
  return `<div class="heat">
    <div class="heat-months" style="grid-template-columns:repeat(${weeks},14px)">${labelsRow}</div>
    <div class="heat-grid">${cols}</div>
    <div class="heat-scale"><span>Meno</span><span class="heat-cell l0"></span><span class="heat-cell l1"></span><span class="heat-cell l2"></span><span class="heat-cell l3"></span><span class="heat-cell l4"></span><span>Più</span></div>
  </div>`;
}

// generic month calendar, shared by Ufficio and Diario
function monthCalendarHTML(year,month,{accentVar,action,cellFor}){
  const todayIso=todayISO();
  const first=new Date(year,month,1);
  const startDow=(first.getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();
  let cells="";
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const iso=isoOf(new Date(year,month,d));
    const isToday=iso===todayIso;
    const isFuture=iso>todayIso;
    const info=cellFor(iso); // {filled:bool, bottomHTML:string}
    if(isFuture){
      cells+=`<div class="cal-cell future"><span class="cal-day">${d}</span></div>`;
    }else{
      cells+=`<button type="button" class="cal-cell ${isToday?"today":""} ${info.filled?"filled":""}" data-action="${action}" data-date="${iso}">
        <span class="cal-day">${d}</span>
        ${info.filled?`<span class="cal-bottom">${info.bottomHTML}</span>`:""}
      </button>`;
    }
  }
  const head=weekdayLabelsIT().map(l=>`<div>${l}</div>`).join("");
  return `<div style="--accent:var(${accentVar})">
    <div class="cal-head">${head}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}

function monthNavHTML({prevAction,nextAction,label,nextDisabled,prevDisabled}){
  return `<div class="month-nav">
    <button class="icon-btn framed" data-action="${prevAction}" title="Precedente" ${prevDisabled?"disabled":""}>‹</button>
    <span class="label">${label}</span>
    <button class="icon-btn framed" data-action="${nextAction}" title="Successivo" ${nextDisabled?"disabled":""}>›</button>
  </div>`;
}

function statTile(icon,label,value,color,sub){
  return `<div class="stat" style="--accent:var(${COLOR_VAR[color]||"--c-sport"});--accent-soft:var(${COLOR_VAR[color]||"--c-sport"}-soft)">
    <div class="stat-icon">${icon}</div>
    <div><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div>
  </div>`;
}
function emptyState(text){ return `<div class="empty">${text}</div>`; }
function recentListHTML(entries){
  return `<div class="rlist">${entries.map(e=>{
    const act=Data.getActivity(e.categoryId,e.activityId);
    const cat=Data.CATEGORIES[e.categoryId];
    return `<div class="rrow">
      <span class="badge" style="--accent-soft:var(${COLOR_VAR[cat.color]}-soft)">${cat.icon}</span>
      <div class="rmain">
        <div class="rtitle">${act?escapeHTML(act.name):"(attività rimossa)"} <span class="rdate">${formatDateIT(e.date)}</span>${e.durationMin?`<span class="rdur">⏳ ${minutesToHM(e.durationMin)}</span>`:""}</div>
        ${e.description?`<div class="rdesc">${escapeHTML(e.description)}</div>`:""}
      </div>
      <div class="ractions">
        <button class="icon-btn" data-action="edit-entry" data-id="${e.id}" title="Modifica">✏️</button>
        <button class="icon-btn" data-action="delete-entry" data-id="${e.id}" title="Elimina">🗑️</button>
      </div>
    </div>`;
  }).join("")}</div>`;
}
</script>
<script>
/* =========================================================
   VIEWS
   ========================================================= */
function lastEntryDateForActivity(entries,categoryId,activityId){
  const list=entries.filter(e=>e.categoryId===categoryId&&e.activityId===activityId).sort((a,b)=>a.date<b.date?1:-1);
  return list[0]?.date||null;
}

function renderDashboard(){
  const entries=Data.ENTRIES;
  const today=todayISO();
  const last7From=isoOf(addDays(new Date(today),-6));
  const last30From=isoOf(addDays(new Date(today),-29));
  const dateSet=Stats.dateSet(entries);
  const currentStreak=Stats.currentStreak(dateSet);
  const longestStreak=Stats.longestStreak(dateSet);
  const todayCount=entries.filter(e=>e.date===today).length;
  const weekCount=Stats.entriesInRange(entries,last7From,today).length;

  const last30=Stats.entriesInRange(entries,last30From,today);
  const byCat=Stats.countsByCategory(last30);
  const donut=donutChartHTML(CATEGORY_ORDER.map(cid=>({label:Data.CATEGORIES[cid].name,value:byCat[cid]||0,color:Data.CATEGORIES[cid].color})),{centerLabel:String(last30.length),centerSub:"ultimi 30gg"});

  const byActivity=Stats.countsByActivity(entries);
  const topActivities=Object.entries(byActivity).map(([key,value])=>{
    const[categoryId,activityId]=key.split("::");
    const act=Data.getActivity(categoryId,activityId);
    return act?{label:act.name,value,color:Data.CATEGORIES[categoryId].color}:null;
  }).filter(Boolean).sort((a,b)=>b.value-a.value).slice(0,7);

  const currentYear=new Date(today).getFullYear();
  const heatmapYear=state.heatmapYear||currentYear;
  const heatCounts=Stats.heatmapCounts(entries,`${heatmapYear}-01-01`,`${heatmapYear}-12-31`);
  const earliestEntryYear=entries.length?Math.min(...entries.map(e=>Number(e.date.slice(0,4)))):currentYear;
  const minHeatmapYear=Math.min(currentYear,earliestEntryYear);

  const recent=[...entries].sort((a,b)=>a.createdAt<b.createdAt?1:-1).slice(0,6);

  const week=weekRange(today), prevWeek=prevWeekRange(today), month=monthRange(today);
  const weekEntries=Stats.entriesInRange(entries,week.fromISO,week.toISO);
  const prevWeekEntries=Stats.entriesInRange(entries,prevWeek.fromISO,prevWeek.toISO);
  const monthEntries=Stats.entriesInRange(entries,month.fromISO,month.toISO);

  return `
    <div class="stat-row">
      ${statTile("📅","Oggi",todayCount,"sport","attività registrate")}
      ${statTile("🔥","Streak attuale",currentStreak,"studio",currentStreak===1?"giorno consecutivo":"giorni consecutivi")}
      ${statTile("🏆","Record streak",longestStreak,"diario","giorni consecutivi")}
      ${statTile("🗓️","Ultimi 7 giorni",weekCount,"sport","attività registrate")}
    </div>
    <div class="grid-2">
      ${periodSummaryCardHTML("Questa settimana",week.label,weekEntries,prevWeekEntries)}
      ${periodSummaryCardHTML("Questo mese",month.label,monthEntries,null)}
    </div>
    <div class="grid-2">
      <div class="card"><div class="card-header"><h3>Sport vs Studio</h3><span class="card-sub">ultimi 30 giorni</span></div>${last30.length?donut:emptyState("Nessuna attività registrata negli ultimi 30 giorni.")}</div>
      <div class="card"><div class="card-header"><h3>Attività più frequenti</h3><span class="card-sub">di sempre</span></div>${topActivities.length?barListHTML(topActivities):emptyState("Nessuna attività registrata finora.")}</div>
    </div>
    <div class="card">
      <div class="card-header"><h3>Costanza</h3>${monthNavHTML({prevAction:"heatmap-prev-year",nextAction:"heatmap-next-year",label:String(heatmapYear),prevDisabled:heatmapYear<=minHeatmapYear,nextDisabled:heatmapYear>=currentYear})}</div>
      ${heatmapHTML(heatCounts,{year:heatmapYear})}
    </div>
    <div class="card">
      <div class="card-header"><h3>Ultime attività registrate</h3><button class="btn btn-primary btn-sm" data-action="quick-log">+ Registra attività</button></div>
      ${recent.length?recentListHTML(recent):emptyState("Non hai ancora registrato nulla. Inizia da Sport o Studio!")}
    </div>`;
}

function periodSummaryCardHTML(title,periodLabel,periodEntries,prevPeriodEntries){
  const catMinutes=Stats.minutesByCategory(periodEntries);
  const prevCatMinutes=prevPeriodEntries?Stats.minutesByCategory(prevPeriodEntries):null;
  const pills=CATEGORY_ORDER.map(cid=>{
    const cat=Data.CATEGORIES[cid];
    const mins=catMinutes[cid]||0;
    let deltaHTML="";
    if(prevCatMinutes){
      const delta=mins-(prevCatMinutes[cid]||0);
      const cls=delta>0?"delta-up":delta<0?"delta-down":"delta-flat";
      const arrow=delta>0?"▲":delta<0?"▼":"＝";
      const text=delta===0?"invariato":`${minutesToHM(Math.abs(delta))} vs sett. scorsa`;
      deltaHTML=`<span class="delta ${cls}">${arrow} ${text}</span>`;
    }
    return `<div class="pill" style="--accent:var(${COLOR_VAR[cat.color]})"><span class="pill-label">${cat.icon} ${cat.name}</span><strong class="pill-value">${minutesToHM(mins)}</strong>${deltaHTML}</div>`;
  }).join("");
  const byActivity=Stats.minutesByActivity(periodEntries);
  const activityBars=Object.entries(byActivity).filter(([,m])=>m>0).map(([key,mins])=>{
    const[categoryId,activityId]=key.split("::");
    const act=Data.getActivity(categoryId,activityId);
    return act?{label:act.name,value:mins,displayValue:minutesToHM(mins),color:Data.CATEGORIES[categoryId].color}:null;
  }).filter(Boolean).sort((a,b)=>b.value-a.value).slice(0,8);
  const totalMin=Stats.totalMinutes(periodEntries);
  return `<div class="card"><div class="card-header"><h3>${title}</h3><span class="card-sub">${periodLabel}</span></div>
    <div class="pills">${pills}</div>
    ${activityBars.length?barListHTML(activityBars):emptyState(totalMin===0&&periodEntries.length===0?"Nessuna attività registrata in questo periodo.":"Nessuna durata registrata (i minuti sono facoltativi): aggiungili quando registri un'attività per vedere qui il riepilogo ore.")}
  </div>`;
}

function renderCategoryPage(categoryId){
  const cat=Data.CATEGORIES[categoryId];
  const entries=Data.ENTRIES.filter(e=>e.categoryId===categoryId);
  const cards=cat.activities.map(act=>{
    const actEntries=entries.filter(e=>e.activityId===act.id);
    const streak=Stats.currentStreak(Stats.dateSet(entries,{activityId:act.id}));
    const lastDate=lastEntryDateForActivity(Data.ENTRIES,categoryId,act.id);
    const totalMin=Stats.totalMinutes(actEntries);
    return `<div class="act-card">
      <div class="act-top"><div class="act-name">${escapeHTML(act.name)}${act.custom?` <span class="tag tag-custom">personalizzata</span>`:""}</div>${act.custom?`<button class="icon-btn" data-action="remove-activity" data-cat="${categoryId}" data-act="${act.id}" title="Rimuovi attività">✕</button>`:""}</div>
      <div class="act-stats"><span>📌 ${actEntries.length} volte</span><span>🔥 ${streak} ${streak===1?"giorno":"giorni"}</span><span>⏱️ ultima: ${daysAgoLabel(lastDate)}</span>${totalMin?`<span>⏳ ${minutesToHM(totalMin)} totali</span>`:""}</div>
      <button class="btn btn-outline btn-block" style="--accent:var(${COLOR_VAR[cat.color]})" data-action="log-activity" data-cat="${categoryId}" data-act="${act.id}">+ Registra oggi</button>
    </div>`;
  }).join("");
  const recent=[...entries].sort((a,b)=>a.date<b.date?1:-1).slice(0,12);
  return `
    <div class="card intro" style="--accent:var(${COLOR_VAR[cat.color]})"><div>Traccia le tue attività di <strong>${cat.name}</strong>: registra ogni giorno cosa hai fatto con una breve descrizione.</div></div>
    <div class="act-grid">${cards}
      <div class="act-card act-add" data-action="add-activity" data-cat="${categoryId}"><div class="add-icon">＋</div><div>Aggiungi nuova attività</div></div>
    </div>
    <div class="card"><div class="card-header"><h3>Storico recente — ${cat.name}</h3></div>${recent.length?recentListHTML(recent):emptyState("Nessuna attività registrata in questa sezione.")}</div>`;
}

function renderOffice(){
  const{year,month}=state.officeMonth;
  const monthLabel=monthLabelOf(year,month);
  const days=Data.OFFICE_DAYS;
  const monthFrom=isoOf(new Date(year,month,1)), monthTo=isoOf(new Date(year,month+1,0));
  const monthTotalMin=Stats.officeMinutesInRange(days,monthFrom,monthTo);
  const daysWorked=Object.keys(days).filter(d=>d>=monthFrom&&d<=monthTo&&(days[d].slots||[]).length).length;
  const now=new Date(); const isCurrentMonth=year===now.getFullYear()&&month===now.getMonth();
  const cal=monthCalendarHTML(year,month,{accentVar:"--c-ufficio",action:"log-office-day",cellFor:iso=>{
    const day=days[iso]; const mins=day?Stats.officeDayMinutes(day):0; const hasNotes=!!(day&&day.notes);
    const bottom=`${mins?`<span>${minutesToHM(mins)}</span>`:""}${hasNotes?`<span title="Note presenti">📝</span>`:""}`;
    return{filled:!!(mins||hasNotes),bottomHTML:bottom};
  }});
  const recentNotes=Object.entries(days).filter(([,d])=>d.notes).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,8);
  const notesHTML=`<div class="rlist">${recentNotes.map(([date,day])=>{
    const mins=Stats.officeDayMinutes(day);
    return `<div class="rrow"><span class="badge" style="--accent-soft:var(--c-ufficio-soft)">🏢</span><div class="rmain"><div class="rtitle">${formatDateIT(date)}${mins?`<span class="rdur">⏳ ${minutesToHM(mins)}</span>`:""}</div><div class="rdesc">${escapeHTML(day.notes)}</div></div><div class="ractions"><button class="icon-btn" data-action="log-office-day" data-date="${date}" title="Modifica">✏️</button></div></div>`;
  }).join("")}</div>`;
  return `
    <div class="card intro" style="--accent:var(--c-ufficio)"><div>Registra i giorni in cui vai in ufficio: orari di entrata/uscita, ore totali e un riepilogo di cosa hai fatto.</div></div>
    <div class="stat-row">${statTile("🏢","Giorni in ufficio",daysWorked,"ufficio",monthLabel)}${statTile("⏳","Ore totali",minutesToHM(monthTotalMin),"ufficio",monthLabel)}</div>
    <div class="card"><div class="card-header"><h3>Calendario</h3>${monthNavHTML({prevAction:"office-prev-month",nextAction:"office-next-month",label:monthLabel,nextDisabled:isCurrentMonth})}</div>${cal}</div>
    <div class="card"><div class="card-header"><h3>Note recenti</h3></div>${recentNotes.length?notesHTML:emptyState("Nessuna nota registrata. Clicca su un giorno nel calendario per aggiungerne una.")}</div>`;
}

function renderDiary(){
  const{year,month}=state.diarioMonth;
  const monthLabel=monthLabelOf(year,month);
  const days=Data.DIARIO_DAYS;
  const monthFrom=isoOf(new Date(year,month,1)), monthTo=isoOf(new Date(year,month+1,0));
  const entriesThisMonth=Object.entries(days).filter(([d])=>d>=monthFrom&&d<=monthTo);
  const daysWritten=entriesThisMonth.length;
  const photosThisMonth=entriesThisMonth.reduce((s,[,d])=>s+(d.photoIds?d.photoIds.length:0),0);
  const now=new Date(); const isCurrentMonth=year===now.getFullYear()&&month===now.getMonth();
  const cal=monthCalendarHTML(year,month,{accentVar:"--c-diario",action:"log-diary-day",cellFor:iso=>{
    const day=days[iso]; const hasText=!!(day&&day.text); const photoCount=day&&day.photoIds?day.photoIds.length:0;
    const bottom=`${hasText?`<span title="Pensieri scritti">✍️</span>`:""}${photoCount?`<span title="${photoCount} foto">📷${photoCount}</span>`:""}`;
    return{filled:hasText||!!photoCount,bottomHTML:bottom};
  }});
  const recentEntries=Object.entries(days).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,8);
  const listHTML=`<div class="rlist">${recentEntries.map(([date,day])=>{
    const excerpt=day.text?(day.text.length>140?day.text.slice(0,140)+"…":day.text):"";
    const photoCount=day.photoIds?day.photoIds.length:0;
    return `<div class="rrow"><span class="badge" style="--accent-soft:var(--c-diario-soft)">📔</span><div class="rmain"><div class="rtitle">${formatDateIT(date)}${photoCount?`<span class="rdur">📷 ${photoCount}</span>`:""}</div><div class="rdesc">${escapeHTML(excerpt)||"<em>Solo foto, nessun testo.</em>"}</div></div><div class="ractions"><button class="icon-btn" data-action="log-diary-day" data-date="${date}" title="Apri">✏️</button></div></div>`;
  }).join("")}</div>`;
  return `
    <div class="card intro" style="--accent:var(--c-diario)"><div>Il tuo diario personale: clicca su un giorno per scrivere pensieri, ricordi o riflessioni, e aggiungere qualche foto.</div></div>
    <div class="stat-row">${statTile("✍️","Giorni scritti",daysWritten,"diario",monthLabel)}${statTile("📷","Foto aggiunte",photosThisMonth,"diario",monthLabel)}</div>
    <div class="card"><div class="card-header"><h3>Calendario</h3>${monthNavHTML({prevAction:"diario-prev-month",nextAction:"diario-next-month",label:monthLabel,nextDisabled:isCurrentMonth})}</div>${cal}</div>
    <div class="card"><div class="card-header"><h3>Pensieri recenti</h3></div>${recentEntries.length?listHTML:emptyState("Nessun pensiero scritto finora. Clicca su un giorno nel calendario per iniziare.")}</div>`;
}

function renderHistory(filters={}){
  const{categoryId="all",activityId="all"}=filters;
  let entries=[...Data.ENTRIES];
  if(categoryId!=="all") entries=entries.filter(e=>e.categoryId===categoryId);
  if(activityId!=="all") entries=entries.filter(e=>e.activityId===activityId);
  entries.sort((a,b)=>a.date<b.date?1:-1);
  const activityOptions=Data.allActivitiesFlat().filter(a=>categoryId==="all"||a.categoryId===categoryId)
    .map(a=>`<option value="${a.id}" ${a.id===activityId?"selected":""}>${escapeHTML(a.name)}</option>`).join("");
  const grouped={};
  for(const e of entries)(grouped[e.date]||=[]).push(e);
  const groupsHTML=Object.keys(grouped).map(date=>`<div class="hist-group"><div class="hist-date">${formatDateIT(date)}</div>${recentListHTML(grouped[date])}</div>`).join("");
  return `
    <div class="card filters-bar">
      <div class="filter-field"><label>Sezione</label><select id="filter-category"><option value="all" ${categoryId==="all"?"selected":""}>Tutte</option>${CATEGORY_ORDER.map(cid=>`<option value="${cid}" ${cid===categoryId?"selected":""}>${Data.CATEGORIES[cid].name}</option>`).join("")}</select></div>
      <div class="filter-field"><label>Attività</label><select id="filter-activity"><option value="all" ${activityId==="all"?"selected":""}>Tutte</option>${activityOptions}</select></div>
      <div class="filter-field filter-count">${entries.length} risultati</div>
    </div>
    ${entries.length?groupsHTML:emptyState("Nessuna attività trovata con questi filtri.")}`;
}

function renderSettings(){
  const categoriesHTML=CATEGORY_ORDER.map(cid=>{
    const cat=Data.CATEGORIES[cid];
    const rows=cat.activities.map(a=>`<div class="settings-row"><span>${escapeHTML(a.name)} ${a.custom?'<span class="tag tag-custom">personalizzata</span>':'<span class="tag tag-default">predefinita</span>'}</span>${a.custom?`<button class="icon-btn" data-action="remove-activity" data-cat="${cid}" data-act="${a.id}" title="Rimuovi">🗑️</button>`:""}</div>`).join("");
    return `<div class="card"><div class="card-header"><h3>${cat.icon} ${cat.name}</h3><button class="btn btn-outline btn-sm" style="--accent:var(${COLOR_VAR[cat.color]})" data-action="add-activity" data-cat="${cid}">+ Nuova attività</button></div>${rows}</div>`;
  }).join("");
  return `
    ${categoriesHTML}
    <div class="card">
      <div class="card-header"><h3>I tuoi dati</h3></div>
      <p class="card-text">I dati sono salvati in un database privato collegato a questa pagina, raggiungibile solo con il link che hai tu — non sono pubblici né indicizzati. Si aggiornano in tempo reale su tutti i dispositivi dove apri questa pagina da Claude.</p>
      <div class="settings-actions">
        <button class="btn btn-primary" data-action="export-data">⬇️ Scarica backup JSON</button>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h3 class="danger-title">Zona pericolosa</h3></div>
      <p class="card-text">Ripristina l'app allo stato iniziale: verranno rimosse tutte le attività registrate e le attività personalizzate (Ufficio e Diario restano intatti).</p>
      <button class="btn btn-danger" data-action="reset-data">Ripristina dati predefiniti</button>
    </div>`;
}
</script>
<script>
/* =========================================================
   NAV + ROUTING + STATE
   ========================================================= */
const state={
  route:"dashboard",
  historyFilters:{categoryId:"all",activityId:"all"},
  heatmapYear:new Date().getFullYear(),
  officeMonth:{year:new Date().getFullYear(),month:new Date().getMonth()},
  diarioMonth:{year:new Date().getFullYear(),month:new Date().getMonth()}
};
const ROUTE_TITLES=Object.fromEntries(ROUTES.map(r=>[r.id,r.group?`${r.icon} ${r.label}`:r.label]));

function renderRailNav(){
  const groups=[];
  let lastGroup="__none__";
  for(const r of ROUTES){
    if(r.group!==lastGroup){ groups.push(r.group?`<div class="rail-label">${r.group}</div>`:""); lastGroup=r.group; }
    groups.push(`<button class="rail-item ${state.route===r.id?"active":""}" data-route="${r.id}"><span class="rail-icon">${r.icon}</span>${r.label}</button>`);
  }
  document.getElementById("rail-nav").innerHTML=groups.join("");
}
function renderTabbar(){
  const tabs=BOTTOM_TAB_IDS.map(id=>{
    const r=ROUTES.find(x=>x.id===id);
    return `<button class="tab-item ${state.route===id?"active":""}" data-route="${id}"><span class="tab-icon">${r.icon}</span>${r.label}</button>`;
  }).join("");
  const moreActive=state.route==="storico"||state.route==="impostazioni";
  document.getElementById("tabbar").innerHTML=tabs+`<button class="tab-item ${moreActive?"active":""}" data-action="open-more-sheet"><span class="tab-icon">•••</span>Altro</button>`;
}

function navigate(route){
  if(!ROUTE_TITLES[route]) route="dashboard";
  state.route=route;
  render();
}

function render(){
  document.getElementById("today-date").textContent=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  document.getElementById("page-title").textContent=ROUTE_TITLES[state.route];
  renderRailNav(); renderTabbar();
  const root=document.getElementById("view-root");
  switch(state.route){
    case "dashboard": root.innerHTML=renderDashboard(); break;
    case "sport": root.innerHTML=renderCategoryPage("sport"); break;
    case "studio": root.innerHTML=renderCategoryPage("studio"); break;
    case "ufficio": root.innerHTML=renderOffice(); break;
    case "diario": root.innerHTML=renderDiary(); break;
    case "storico": root.innerHTML=renderHistory(state.historyFilters); break;
    case "impostazioni": root.innerHTML=renderSettings(); break;
  }
}

/* =========================================================
   MODALS
   ========================================================= */
const overlay=document.getElementById("overlay");
const modalEl=document.getElementById("modal");

function openModal(html,{wide=false}={}){
  modalEl.innerHTML=html;
  modalEl.classList.toggle("wide",wide);
  overlay.classList.remove("hidden");
  const first=modalEl.querySelector("input,select,textarea");
  if(first) first.focus();
}
function closeModal(){
  overlay.classList.add("hidden");
  modalEl.classList.remove("wide");
  modalEl.innerHTML="";
}
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeModal(); });

function activityOptionsFor(categoryId,selected){
  return Data.CATEGORIES[categoryId].activities.map(a=>`<option value="${a.id}" ${a.id===selected?"selected":""}>${escapeHTML(a.name)}</option>`).join("");
}

function openEntryModal({categoryId,activityId,entryId}){
  const lockCategory=!!categoryId;
  let entry=null;
  if(entryId){ entry=Data.ENTRIES.find(e=>e.id===entryId); categoryId=entry.categoryId; activityId=entry.activityId; }
  categoryId=categoryId||CATEGORY_ORDER[0];
  const cat=Data.CATEGORIES[categoryId];
  activityId=activityId||cat.activities[0]?.id;
  const dateVal=entry?entry.date:todayISO();
  const descVal=entry?entry.description:"";
  const durationVal=entry&&entry.durationMin?entry.durationMin:"";
  const html=`
    <div class="modal-head"><h3>${entry?"Modifica attività":"Registra attività"}</h3><button class="icon-btn" data-close>✕</button></div>
    <form id="entry-form" class="modal-form">
      <div class="row"><label>Sezione</label><select id="entry-category" ${lockCategory?"disabled":""}>${CATEGORY_ORDER.map(cid=>`<option value="${cid}" ${cid===categoryId?"selected":""}>${Data.CATEGORIES[cid].icon} ${Data.CATEGORIES[cid].name}</option>`).join("")}</select></div>
      <div class="row"><label>Attività</label><select id="entry-activity">${activityOptionsFor(categoryId,activityId)}</select></div>
      <div class="row-split">
        <div class="row"><label>Data</label><input type="date" id="entry-date" value="${dateVal}" max="${todayISO()}"></div>
        <div class="row"><label>Minuti (facoltativo)</label><input type="number" id="entry-duration" min="0" step="5" placeholder="Es. 30" value="${durationVal}"></div>
      </div>
      <div class="row"><label>Cosa hai fatto? (breve descrizione)</label><textarea id="entry-desc" rows="3" placeholder="Es. 5km al parco, ritmo costante...">${escapeHTML(descVal)}</textarea></div>
      <div class="modal-actions">
        ${entry?`<button type="button" class="btn btn-danger" id="entry-delete">Elimina</button>`:"<span></span>"}
        <div><button type="button" class="btn btn-ghost" data-close>Annulla</button><button type="submit" class="btn btn-primary">Salva</button></div>
      </div>
    </form>`;
  openModal(html);
  const catSelect=document.getElementById("entry-category"), actSelect=document.getElementById("entry-activity");
  catSelect.addEventListener("change",()=>{ actSelect.innerHTML=activityOptionsFor(catSelect.value,null); });
  modalEl.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  if(entry) document.getElementById("entry-delete").addEventListener("click",()=>{ if(confirm("Eliminare questa attività registrata?")){ Data.removeEntry(entry.id); closeModal(); } });
  document.getElementById("entry-form").addEventListener("submit",e=>{
    e.preventDefault();
    const payload={date:document.getElementById("entry-date").value||todayISO(),categoryId:catSelect.value,activityId:actSelect.value,description:document.getElementById("entry-desc").value,durationMin:document.getElementById("entry-duration").value};
    if(entry) Data.updateEntry(entry.id,payload); else Data.addEntry(payload);
    closeModal();
  });
}

function openAddActivityModal(categoryId){
  const cat=Data.CATEGORIES[categoryId];
  const html=`
    <div class="modal-head"><h3>Nuova attività — ${cat.name}</h3><button class="icon-btn" data-close>✕</button></div>
    <form id="activity-form" class="modal-form">
      <div class="row"><label>Nome attività</label><input type="text" id="new-activity-name" placeholder="Es. Yoga, Lettura tecnica..." required maxlength="60"></div>
      <div class="modal-actions"><span></span><div><button type="button" class="btn btn-ghost" data-close>Annulla</button><button type="submit" class="btn btn-primary">Aggiungi</button></div></div>
    </form>`;
  openModal(html);
  modalEl.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  document.getElementById("activity-form").addEventListener("submit",e=>{
    e.preventDefault();
    const name=document.getElementById("new-activity-name").value.trim();
    if(!name)return;
    Data.addActivity(categoryId,name);
    closeModal();
  });
}

function officeSlotRowHTML(slot={}){
  return `<div class="slot-row"><input type="time" class="slot-in" value="${slot.in||""}"><span class="slot-sep">–</span><input type="time" class="slot-out" value="${slot.out||""}"><button type="button" class="icon-btn" data-remove-slot title="Rimuovi fascia">🗑️</button></div>`;
}
function openOfficeDayModal(date){
  const existing=Data.getOfficeDay(date);
  const slots=existing&&existing.slots.length?existing.slots:[{in:"",out:""}];
  const html=`
    <div class="modal-head"><h3>🏢 ${formatDateIT(date)}</h3><button class="icon-btn" data-close>✕</button></div>
    <form id="office-form" class="modal-form">
      <div class="row"><label>Fasce orarie</label><div id="office-slots">${slots.map(officeSlotRowHTML).join("")}</div><button type="button" class="btn btn-outline btn-sm" style="--accent:var(--c-ufficio);align-self:flex-start;margin-top:2px;" id="office-add-slot">+ Aggiungi fascia oraria</button></div>
      <div class="row"><label>Note — cosa hai fatto</label><textarea id="office-notes" rows="4" placeholder="Riepiloga cosa hai fatto in ufficio...">${escapeHTML(existing?existing.notes:"")}</textarea></div>
      <div class="modal-actions">${existing?`<button type="button" class="btn btn-danger" id="office-delete">Elimina giorno</button>`:"<span></span>"}<div><button type="button" class="btn btn-ghost" data-close>Annulla</button><button type="submit" class="btn btn-primary">Salva</button></div></div>
    </form>`;
  openModal(html);
  modalEl.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  const slotsBox=document.getElementById("office-slots");
  function bindRemove(){ slotsBox.querySelectorAll("[data-remove-slot]").forEach(btn=>{ btn.onclick=()=>{ if(slotsBox.children.length>1) btn.closest(".slot-row").remove(); else { const row=btn.closest(".slot-row"); row.querySelector(".slot-in").value=""; row.querySelector(".slot-out").value=""; } }; }); }
  bindRemove();
  document.getElementById("office-add-slot").addEventListener("click",()=>{ slotsBox.insertAdjacentHTML("beforeend",officeSlotRowHTML()); bindRemove(); });
  if(existing) document.getElementById("office-delete").addEventListener("click",()=>{ if(confirm("Eliminare tutti i dati di questo giorno (orari e note)?")){ Data.deleteOfficeDay(date); closeModal(); } });
  document.getElementById("office-form").addEventListener("submit",e=>{
    e.preventDefault();
    const parsedSlots=[...slotsBox.querySelectorAll(".slot-row")].map(row=>({in:row.querySelector(".slot-in").value,out:row.querySelector(".slot-out").value})).filter(s=>s.in&&s.out);
    if(parsedSlots.some(s=>s.out<=s.in)){ alert("L'orario di uscita deve essere successivo a quello di entrata in ogni fascia."); return; }
    Data.saveOfficeDay(date,{slots:parsedSlots,notes:document.getElementById("office-notes").value});
    closeModal();
  });
}

function readAndDownscaleImage(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error||new Error("Lettura file non riuscita"));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("File immagine non valido"));
      img.onload=()=>{
        let{width,height}=img;
        if(width>maxDim||height>maxDim){ const s=maxDim/Math.max(width,height); width=Math.round(width*s); height=Math.round(height*s); }
        const canvas=document.createElement("canvas"); canvas.width=width; canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function fileToBudgetedDataURL(file){
  // niente vincolo rigido di dimensione qui (il database non ha il limite per-documento
  // che aveva l'artifact Claude): ridimensiona solo per tenere le pagine veloci da caricare.
  let maxDim=1800, quality=0.85;
  for(let i=0;i<4;i++){
    const dataUrl=await readAndDownscaleImage(file,maxDim,quality);
    if(dataUrl.length<900000) return dataUrl;
    maxDim=Math.round(maxDim*0.8); quality=Math.max(0.5,quality-0.12);
  }
  return readAndDownscaleImage(file,900,0.5);
}

function diaryPhotoThumbHTML(id,dataUrl){
  return `<div class="photo-thumb" data-photo-id="${id}"><img src="${dataUrl}" alt=""><button type="button" class="photo-remove" data-remove-photo title="Rimuovi foto">✕</button></div>`;
}
async function openDiaryDayModal(date){
  const existing=Data.getDiaryDay(date);
  const html=`
    <div class="modal-head"><h3>📔 ${formatDateIT(date)}</h3><button class="icon-btn" data-close>✕</button></div>
    <form id="diary-form" class="modal-form">
      <div class="row"><textarea id="diary-text" rows="10" placeholder="Cosa hai in mente oggi? Scrivi pensieri, ricordi, riflessioni...">${escapeHTML(existing?existing.text:"")}</textarea></div>
      <div class="row"><label>Foto (facoltative)</label><div id="diary-photos" class="photo-grid"></div><input type="file" id="diary-photo-input" accept="image/*" multiple hidden><button type="button" class="btn btn-outline btn-sm" style="--accent:var(--c-diario);align-self:flex-start;" id="diary-add-photo">＋ Aggiungi foto</button></div>
      <div class="modal-actions">${existing?`<button type="button" class="btn btn-danger" id="diary-delete">Elimina giorno</button>`:"<span></span>"}<div><button type="button" class="btn btn-ghost" data-close>Annulla</button><button type="submit" class="btn btn-primary">Salva</button></div></div>
    </form>`;
  openModal(html,{wide:true});
  modalEl.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));

  const photosBox=document.getElementById("diary-photos");
  function bindPhotoRemove(){ photosBox.querySelectorAll("[data-remove-photo]").forEach(btn=>{ btn.onclick=()=>btn.closest(".photo-thumb").remove(); }); }

  const existingIds=existing&&existing.photoIds?existing.photoIds:[];
  if(existingIds.length){
    photosBox.innerHTML=existingIds.map(id=>diaryPhotoThumbHTML(id,"")).join("");
    Data.getPhotos(existingIds).then(photos=>{
      photos.forEach(p=>{ const el=photosBox.querySelector(`[data-photo-id="${p.id}"] img`); if(el) el.src=p.dataUrl; });
      bindPhotoRemove();
    });
  }
  bindPhotoRemove();

  document.getElementById("diary-add-photo").addEventListener("click",()=>{ document.getElementById("diary-photo-input").click(); });
  document.getElementById("diary-photo-input").addEventListener("change",async e=>{
    const files=[...e.target.files]; e.target.value="";
    for(const file of files){
      try{
        const dataUrl=await fileToBudgetedDataURL(file);
        const id=await Data.addPhoto(dataUrl,date);
        photosBox.insertAdjacentHTML("beforeend",diaryPhotoThumbHTML(id,dataUrl));
        bindPhotoRemove();
      }catch(err){ alert("Non sono riuscito a caricare una foto: "+err.message); }
    }
  });

  if(existing) document.getElementById("diary-delete").addEventListener("click",async()=>{ if(confirm("Eliminare il testo e le foto di questo giorno?")){ await Data.deleteDiaryDay(date); closeModal(); } });

  document.getElementById("diary-form").addEventListener("submit",e=>{
    e.preventDefault();
    const ids=[...photosBox.querySelectorAll(".photo-thumb")].map(el=>el.dataset.photoId);
    Data.saveDiaryDay(date,{text:document.getElementById("diary-text").value,photoIds:ids});
    closeModal();
  });
}

function openMoreSheet(){
  const html=`
    <div class="modal-head"><h3>Altro</h3><button class="icon-btn" data-close>✕</button></div>
    <button type="button" class="sheet-item" data-route="storico" data-close><span class="sheet-icon">🗓️</span>Storico</button>
    <button type="button" class="sheet-item" data-route="impostazioni" data-close><span class="sheet-icon">⚙️</span>Impostazioni</button>`;
  openModal(html);
  modalEl.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
}

function exportBackup(){
  const payload={categories:Data.CATEGORIES,entries:Data.ENTRIES,office:{days:Data.OFFICE_DAYS},diario:{days:Data.DIARIO_DAYS}};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`habit-tracker-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* =========================================================
   GLOBAL EVENT DELEGATION
   ========================================================= */
document.addEventListener("click",e=>{
  const routeBtn=e.target.closest("[data-route]");
  if(routeBtn){ navigate(routeBtn.dataset.route); if(routeBtn.hasAttribute("data-close")) closeModal(); return; }

  const btn=e.target.closest("[data-action]");
  if(!btn)return;
  const action=btn.dataset.action;
  if(action==="log-activity") openEntryModal({categoryId:btn.dataset.cat,activityId:btn.dataset.act});
  else if(action==="quick-log") openEntryModal({});
  else if(action==="edit-entry") openEntryModal({entryId:btn.dataset.id});
  else if(action==="delete-entry"){ if(confirm("Eliminare questa attività registrata?")) Data.removeEntry(btn.dataset.id); }
  else if(action==="add-activity") openAddActivityModal(btn.dataset.cat);
  else if(action==="remove-activity"){ if(confirm("Rimuovere questa attività personalizzata? Lo storico registrato resterà visibile.")) Data.removeActivity(btn.dataset.cat,btn.dataset.act); }
  else if(action==="export-data") exportBackup();
  else if(action==="reset-data"){ if(confirm("Sei sicuro? Tutte le attività registrate e personalizzate di Sport/Studio verranno rimosse.")){ Data.resetSportStudio(); } }
  else if(action==="heatmap-prev-year"){ state.heatmapYear--; render(); }
  else if(action==="heatmap-next-year"){ if(state.heatmapYear<new Date().getFullYear()){ state.heatmapYear++; render(); } }
  else if(action==="log-office-day") openOfficeDayModal(btn.dataset.date);
  else if(action==="office-prev-month"){ const s=state.officeMonth; s.month--; if(s.month<0){s.month=11;s.year--;} render(); }
  else if(action==="office-next-month"){ const s=state.officeMonth; const now=new Date(); if(!(s.year===now.getFullYear()&&s.month===now.getMonth())){ s.month++; if(s.month>11){s.month=0;s.year++;} render(); } }
  else if(action==="log-diary-day") openDiaryDayModal(btn.dataset.date);
  else if(action==="diario-prev-month"){ const s=state.diarioMonth; s.month--; if(s.month<0){s.month=11;s.year--;} render(); }
  else if(action==="diario-next-month"){ const s=state.diarioMonth; const now=new Date(); if(!(s.year===now.getFullYear()&&s.month===now.getMonth())){ s.month++; if(s.month>11){s.month=0;s.year++;} render(); } }
  else if(action==="open-more-sheet") openMoreSheet();
});
document.addEventListener("change",e=>{
  if(e.target.id==="filter-category"){ state.historyFilters.categoryId=e.target.value; state.historyFilters.activityId="all"; render(); }
  else if(e.target.id==="filter-activity"){ state.historyFilters.activityId=e.target.value; render(); }
});


render();
Data.init();
</script>
